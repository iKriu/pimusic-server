# PiMusic за nginx (или Nginx Proxy Manager → Proxy Host → вкладка «Advanced» → «Custom Nginx Configuration»).
# Замените music.example.com на свой домен, 192.168.1.20 — на адрес сервера PiMusic в локальной сети.
# Jellyfin слушает :8096, бот (Mini App, API, живые потоки, загрузки) — :8097.
# В .env: STREAM_PUBLIC_URL=https://music.example.com и TRUSTED_PROXIES=<адрес этого прокси>/32.
# В Nginx Proxy Manager основной адрес хоста (Forward Hostname/Port) — Jellyfin 192.168.1.20:8096, а блоки location
# ниже — в поле «Custom Nginx Configuration» (без server { }). Не используйте там $server:$port в proxy_pass — это
# адрес Jellyfin, и загрузки получат 404.

server {
    listen 443 ssl;
    http2 on;
    server_name music.example.com;
    # ssl_certificate     /etc/letsencrypt/live/music.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/music.example.com/privkey.pem;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Jellyfin (веб-плеер, Finamp, Symfonium, приложения Jellyfin)
    location / {
        proxy_pass http://192.168.1.20:8096;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    # живые потоки «Моя Волна»
    location /stream/ {
        proxy_pass http://192.168.1.20:8097;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    # Mini App / PWA
    location /app/ {
        proxy_pass http://192.168.1.20:8097;
    }

    # загрузка своих файлов (и /api/uploads — тот же префикс)
    location /api/upload {
        client_max_body_size 1g;          # тело запроса целиком (несколько файлов за раз)
        proxy_request_buffering off;      # поток сразу в бот, без временного файла nginx
        client_body_timeout 120s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_http_version 1.1;
        proxy_pass http://192.168.1.20:8097;
    }

    location /api/ {
        client_max_body_size 5m;
        proxy_pass http://192.168.1.20:8097;
        proxy_read_timeout 120s;
    }

    # необязательно: раздача обновлений своих сборок приложений со своего сервера ($DATA_DIR/updates)
    location /updates/ {
        proxy_pass http://192.168.1.20:8097;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}

# Проверка: curl -s -o /dev/null -w '%{http_code}\n' -X POST https://music.example.com/api/upload → 401 (а не 404).
